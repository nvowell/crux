[workspace]
resolver = "3"
members = [
    "crux_core",
    "crux_http",
    "crux_kv",
    "crux_macros",
    "crux_time",
    "doctest_support",
    "examples_support/api_server",
]

[workspace.package]
authors = ["Red Badger Consulting Limited"]
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/redbadger/crux/"
license = "Apache-2.0"
keywords = ["cross-platform-ui", "crux", "crux_core", "ffi", "wasm"]
categories = ["gui", "wasm", "development-tools::ffi"]

[workspace.dependencies]
anyhow = "1.0"
facet = "=0.46.5"
#facet_generate = "0.19"
#facet-generate-attrs = "0.18"
# grypt's patches to facet-generate, on nvowell/facet-generate's grypt-patches
# branch. Pinned by rev rather than branch so a push there cannot change what
# builds. A crate that also depends on facet-generate-attrs directly (grypt's
# `shared` does) must name the same URL and rev, or Cargo builds two copies and
# the attribute grammar stops matching.
facet_generate = { git = "https://github.com/nvowell/facet-generate", rev = "3eb92c462557c287496e42c2d4fa6b0341705e13" }
facet-generate-attrs = { git = "https://github.com/nvowell/facet-generate", rev = "3eb92c462557c287496e42c2d4fa6b0341705e13" }
serde = "1.0"
thiserror = "2.0"
uniffi_bindgen = "=0.29.4"
boltffi = "=0.29.3"

[workspace.lints.clippy]
pedantic = "warn"
nursery = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
split-debuginfo = "unpacked"
